</style></head><body><h1>ResellGO Radar</h1><p>Synchronise les annonces visibles sur la page Vinted actuellement ouverte.</p><section id="login"><input id="email" type="email" placeholder="Email ResellGO"><input id="password" type="password" placeholder="Mot de passe ResellGO"><button id="connect">Connecter ResellGO</button></section><section id="scanner" class="hide"><p id="account"></p><label>Revente cible estimée<input id="multiplier" type="number" min="1" max="3" step="0.05" value="1.35"></label><label><input id="autoSync" type="checkbox" checked style="width:auto"> Synchronisation automatique (30 s)</label><button id="scan">Scanner maintenant</button><button id="logout" class="ghost">Déconnecter</button></section><div id="status" class="status hide"></div><p class="fine">L’extension ne lit ni mot de passe ni cookie Vinted. L’auto-sync fonctionne uniquement lorsque la page Vinted est ouverte.</p><script src="popup.js"></script></body></html>
